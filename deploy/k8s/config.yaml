apiVersion: v1
kind: ConfigMap
metadata:
  name: pse-config
data:
  PSE_SHARDS: "4"
  PSE_TICK_MS: "5000"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://datadog-agent.datadog.svc:4318"
  OTEL_SERVICE_NAME: "plate-session-engine"
  DD_ENV: "staging"
---
# DATABASE_URL, REDIS_URL, PSE_EDGE_TOKEN, PSE_OPERATOR_TOKEN and ANTHROPIC_API_KEY come from AWS SSM through the
# External Secrets Operator; nothing secret is in this repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pse-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: pse-secrets
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: /pse/staging/database-url }
    - secretKey: REDIS_URL
      remoteRef: { key: /pse/staging/redis-url }
    - secretKey: PSE_EDGE_TOKEN
      remoteRef: { key: /pse/staging/edge-token }
    - secretKey: PSE_OPERATOR_TOKEN
      remoteRef: { key: /pse/staging/operator-token }
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: { key: /pse/staging/anthropic-api-key }
